<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header>
      <h1>Study Desk</h1>
      <p>Ringkas catatanmu, lalu belajar pakai flashcard.</p>
    </header>

    <!-- Bagian 1: ringkasan -->
    <section class="box">
      <h2>1. Ringkas catatan</h2>
      <textarea id="notes" placeholder="Tempel catatan atau materi kuliah di sini..."></textarea>
      <div class="buttons">
        <button id="summarizeBtn">Ringkas</button>
        <button id="makeCardsBtn" class="soft">Buat flashcard</button>
      </div>
      <p id="summary" class="result"></p>
    </section>

    <!-- Bagian 2: flashcard -->
    <section class="box">
      <h2>2. Flashcard</h2>
      <div id="card">Belum ada kartu</div>
      <p id="counter" class="hint"></p>
      <div class="buttons center">
        <button id="prevBtn" class="soft">&larr; Sebelumnya</button>
        <button id="flipBtn">Balik</button>
        <button id="nextBtn" class="soft">Berikutnya &rarr;</button>
      </div>

      <h3>Tambah kartu sendiri</h3>
      <input id="question" placeholder="Pertanyaan">
      <input id="answer" placeholder="Jawaban">
      <button id="addBtn">Tambah kartu</button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
